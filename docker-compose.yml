services:
  mock-llm:
    build: ./mock-llm
    environment:
      PORT: "4001"
      MOCK_LLM_LATENCY_MS: "350"
      MOCK_LLM_FAILURE_RATE: "0"
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  vector-db:
    build: ./vector-db
    environment:
      PORT: "4002"
      VECTOR_DB_PERSIST: /data/vectors.json
    volumes:
      - vector-data:/data
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      PORT: "4000"
      MOCK_LLM_URL: http://mock-llm:4001
      VECTOR_DB_URL: http://vector-db:4002
      DATA_DIR: /app/data
      RUNTIME_DIR: /app/runtime
      SIM_TICK_MS: "3000"
    volumes:
      - ./data:/app/data:ro
      - api-data:/app/runtime
    depends_on:
      mock-llm:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  vector-data:
  api-data:
